<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSCE AI Simulator</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d2e; --surface2: #252840; --border: #2e3250;
    --text: #e8eaf0; --muted: #7b829e; --accent: #6c72ff; --accent2: #a78bfa;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  #app { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  h1 span { background: linear-gradient(90deg, #6c72ff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card:hover.clickable { border-color: var(--accent); cursor: pointer; }
  .card.clickable.selected { border-color: var(--accent); background: rgba(108,114,255,0.08); }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--accent2); }
  .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.secondary:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  input[type=text], textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 0.9rem; }
  .step-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .step-pill { padding: 5px 12px; border-radius: 99px; font-size: 0.72rem; font-weight: 600; border: 1px solid var(--border); color: var(--muted); }
  .step-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step-pill.done { background: rgba(34,197,94,0.15); color: var(--green); border-color: rgba(34,197,94,0.3); }
  .chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.patient { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.system { align-self: center; background: transparent; color: var(--muted); font-size: 0.78rem; font-style: italic; }
  .finding-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .finding-card.signifikan { border-color: var(--green); background: rgba(34,197,94,0.06); }
  .finding-card .nama { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }
  .finding-card img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 7px 14px; font-size: 0.85rem; cursor: pointer; }
  .chip.selected { border-color: var(--accent); background: rgba(108,114,255,0.15); }
  .chip.correct { border-color: var(--green); background: rgba(34,197,94,0.15); }
  .chip.incorrect { border-color: var(--red); background: rgba(239,68,68,0.15); }
  .chip.rx { border-radius: 10px; white-space: pre-line; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.8rem; line-height: 1.5; text-align: left; max-width: 320px; }
  #ddSearch { width: 100%; }
  #ddSelected .chip.selected { background: rgba(108,114,255,0.2); }
  #ddOptions .chip:hover { border-color: var(--accent); }
  .loading { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  a.back { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  a.back:hover { color: var(--accent); }

  /* ---- category select-all toolbar (landing) ---- */
  .cat-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }

  /* ---- DD picker: browse-by-Stase ---- */
  .dd-mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .dd-mode-tab { flex: 1; text-align: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; background: transparent; }
  .dd-mode-tab.active { border-color: var(--accent); color: var(--text); background: rgba(108,114,255,0.1); }
  .stase-group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .stase-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; background: var(--surface2); font-size: 0.85rem; font-weight: 600; }
  .stase-header:hover { color: var(--accent); }
  .stase-count { color: var(--muted); font-weight: 400; font-size: 0.75rem; }
  .stase-caret { color: var(--muted); font-size: 0.75rem; transition: transform .15s ease; }
  .stase-group.open .stase-caret { transform: rotate(90deg); }
  .stase-body { display: none; padding: 12px 14px; gap: 8px; flex-wrap: wrap; }
  .stase-group.open .stase-body { display: flex; }

  /* ---- Tatalaksana: R/ workspace ---- */
  .rx-top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .rx-cards-scroll { max-height: 34vh; overflow-y: auto; padding-right: 2px; }
  .rx-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.82rem; line-height: 1.55; position: relative; }
  .rx-card:hover { border-color: var(--accent2); }
  .rx-card.selected { border-color: var(--accent); background: rgba(108,114,255,0.08); box-shadow: 0 0 0 1px var(--accent) inset; }
  .rx-card .rx-line { color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .rx-card .rx-line.sig { color: var(--muted); margin-top: 2px; }
  .rx-card .rx-line.empty { color: var(--muted); font-style: italic; }
  .rx-card .rx-remove { position: absolute; top: 8px; right: 10px; color: var(--muted); background: none; border: none; font-size: 0.9rem; cursor: pointer; line-height: 1; padding: 2px 4px; }
  .rx-card .rx-remove:hover { color: var(--red); }
  .rx-add-btn { width: 100%; border: 1px dashed var(--border); background: transparent; color: var(--muted); border-radius: 12px; padding: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .rx-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .rx-empty-hint { color: var(--muted); font-size: 0.8rem; font-style: italic; padding: 8px 2px; }
  .rx-bottom { padding-top: 4px; }
  .rx-field-label { text-transform: uppercase; font-size: 0.72rem; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; font-weight: 700; }
  .rx-field-label:first-child { margin-top: 0; }
  .rx-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 0.88rem; font-family: 'Consolas', 'Courier New', monospace; resize: vertical; min-height: 56px; }
  .rx-input:disabled { opacity: .5; cursor: not-allowed; }
  .rx-input::placeholder { color: var(--muted); opacity: .7; }
  .rx-noselect-notice { background: var(--surface2); border: 1px dashed var(--border); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 0.82rem; text-align: center; }

  /* ---- Edukasi essay ---- */
  .essay-input { width: 100%; min-height: 140px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 0.9rem; line-height: 1.5; resize: vertical; }

  /* ---- Reveal: answer vs key (ungraded) ---- */
  .answer-block { margin-bottom: 14px; }
  .answer-block .answer-label { text-transform: uppercase; font-size: 0.7rem; letter-spacing: .04em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .answer-block .answer-body { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap; }
  .answer-block.key .answer-body { border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.06); }
  .answer-body.rxmono { font-family: 'Consolas', 'Courier New', monospace; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
